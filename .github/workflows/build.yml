name: Build Nox

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    name: Windows (.exe / .msi)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - run: npx tauri build
      - uses: actions/upload-artifact@v4
        with:
          name: nox-windows
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi

  android:
    name: Android (APK universel)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - name: SDK et NDK Android (déjà présents sur le runner)
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" --install "build-tools;34.0.0" "platforms;android-34" > /dev/null
          if [ -n "$ANDROID_NDK_LATEST_HOME" ] && [ -d "$ANDROID_NDK_LATEST_HOME" ]; then
            echo "NDK_HOME=$ANDROID_NDK_LATEST_HOME" >> "$GITHUB_ENV"
          else
            "$SDKM" --install "ndk;27.2.12479018" > /dev/null
            echo "NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"
          fi
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - name: Préparer le projet Android
        run: npx tauri android init --ci
      - name: Compiler l'APK
        run: npx tauri android build --apk --ci
      - name: Signer l'APK
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KEYSTORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASS }}
        run: |
          BT="$ANDROID_HOME/build-tools/34.0.0"
          APK=$(find src-tauri/gen/android/app/build/outputs/apk -name '*universal*release*unsigned*.apk' | head -1)
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > nox.jks
            PASS="$KEYSTORE_PASS"
          else
            # Pas de clé fournie : clé jetable (il faudra désinstaller l'ancienne version avant chaque mise à jour).
            PASS=noxnoxnox
            keytool -genkeypair -v -keystore nox.jks -alias nox -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass "$PASS" -keypass "$PASS" -dname "CN=Nox"
          fi
          "$BT/zipalign" -f -p 4 "$APK" aligned.apk
          "$BT/apksigner" sign --ks nox.jks --ks-key-alias nox --ks-pass "pass:$PASS" --key-pass "pass:$PASS" --out Nox-universal.apk aligned.apk
          "$BT/apksigner" verify Nox-universal.apk
      - uses: actions/upload-artifact@v4
        with:
          name: nox-android
          path: Nox-universal.apk

  release:
    name: Publier la release
    # Sur un tag v*, ou sur main quand le message de commit contient [release]
    if: startsWith(github.ref, 'refs/tags/v') || (github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, '[release]'))
    needs: [windows, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - id: v
        run: echo "tag=v$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v5
        with:
          path: out
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || steps.v.outputs.tag }}
          name: Nox ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || steps.v.outputs.tag }}
          target_commitish: ${{ github.sha }}
          files: |
            out/nox-windows/**/*
            out/nox-android/*.apk
